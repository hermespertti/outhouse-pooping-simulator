<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Outhouse Pooping Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍄</text></svg>">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87c4ff;font-family:'Trebuchet MS','Comic Sans MS',system-ui,sans-serif;user-select:none;}
  #app{width:100%;height:100%;display:block;}
  .hud{position:fixed;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none;z-index:10;}
  #score{top:14px;left:18px;font-size:34px;font-weight:900;}
  #score .lbl{font-size:14px;font-weight:700;opacity:.85;display:block;letter-spacing:1px;}
  #combo{top:14px;right:18px;font-size:30px;font-weight:900;text-align:right;transition:transform .12s;}
  #combo.pop{transform:scale(1.35) rotate(-4deg);}
  #combo .mult{font-size:16px;display:block;opacity:.9;}
  #gaugewrap{right:26px;top:50%;transform:translateY(-50%);width:30px;height:300px;background:rgba(0,0,0,.4);border:3px solid #fff;border-radius:16px;overflow:hidden;position:fixed;z-index:10;}
  #gauge{position:absolute;bottom:0;left:0;width:100%;height:0%;background:#7ed957;transition:none;border-radius:0 0 10px 10px;}
  #gauge .band{position:absolute;left:0;width:100%;background:rgba(255,220,60,.55);bottom:70%;height:25%;}
  #gaugelbl{position:fixed;right:22px;width:44px;text-align:center;z-index:11;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.6);pointer-events:none;}
  #gearm{bottom:calc(50% + 158px);}
  #gaugev{top:calc(50% - 178px);}
  #hint{bottom:12px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:700;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:12px;white-space:nowrap;}
  #toast{top:26%;left:50%;transform:translateX(-50%);font-size:40px;font-weight:900;opacity:0;}
  #toast.show{animation:toast 1.3s ease-out forwards;}
  @keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.4);}15%{opacity:1;transform:translateX(-50%) scale(1.15);}30%{transform:translateX(-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1);}}
  #unlock{top:44%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:900;background:rgba(60,30,0,.8);border:3px solid #ffd54a;padding:10px 22px;border-radius:14px;opacity:0;}
  #unlock.show{animation:toast 2.2s ease-out forwards;}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);z-index:20;}
  #equip{top:64px;left:18px;font-size:13px;font-weight:700;opacity:.9;line-height:1.5;}
</style>
</head>
<body>
<canvas id="app"></canvas>
<div class="hud" id="score"><span class="lbl">SCORE</span><span id="scorev">0</span></div>
<div class="hud" id="combo"></div>
<div id="gaugewrap"><div class="band"></div><div id="gauge"></div></div>
<div id="gaugelbl" id="gearm"></div>
<div class="hud" id="gearm">ARM</div>
<div class="hud" id="gaugev">GLOW</div>
<div class="hud" id="equip"></div>
<div class="hud" id="hint">HOLD SPACE to strain · release to drop · ← → aim · ↑ ↓ loft · 1-4 thrones</div>
<div class="hud" id="toast"></div>
<div class="hud" id="unlock"></div>
<div id="load">digging up the outhouse…</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
